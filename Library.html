<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Library</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --blue1:#1e3a8a;
    --blue2:#3b82f6;
    --light:#eff6ff;
    --border:#dbeafe;
}

*{box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
    padding:20px;
}

.head{text-align:center;margin-bottom:30px;}

.head h1{
    font-size:3rem;
    background:linear-gradient(135deg,var(--blue1),var(--blue2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.searchWrap{
    max-width:650px;
    margin:0 auto 20px auto;
    background:white;
    border-radius:12px;
    padding:5px;
    border:2px solid var(--border);
}

.searchWrap input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    background:var(--light);
    border-radius:10px;
}

.btnRow{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.btnBox{
    padding:16px;
    text-align:center;
    background:white;
    border:2px solid var(--border);
    border-radius:12px;
    color:var(--blue2);
    cursor:pointer;
    transition:0.3s;
}

.btnBox:hover{
    background:var(--blue2);
    color:white;
}

.bookArea{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    margin-top:30px;
}

.bookItem{
    background:white;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.bookItem:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.bookItem:active{
    transform:scale(0.96);
}

.bookItem img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.bookText{padding:15px;}

.ok{color:#3b82f6;}
.no{color:#dc2626;}

.returnBtn{
    margin-top:10px;
    padding:6px 10px;
    border:none;
    background:#dc2626;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="head">
<h1><i class="fas fa-book-open"></i> University Library</h1>
</div>

<div class="searchWrap">
<input type="text" id="findBook" placeholder="Search by title or author...">
</div>

<div class="btnRow">
<div class="btnBox" onclick="showAll()">All Books</div>
<div class="btnBox" onclick="showMine()">My Books</div>
<div class="btnBox" onclick="showDone()">Returned</div>
</div>

<div id="showHere" class="bookArea"></div>

<script>

let bookList=[
{id:1,t:"Clean Code",a:"Robert Martin",img:"https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c",free:true},
{id:2,t:"Pragmatic Programmer",a:"David Thomas",img:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8",free:false},
{id:3,t:"Data Intensive Apps",a:"Kleppmann",img:"https://images.unsplash.com/photo-1544947950-fa07a98d237f",free:true},
{id:4,t:"Python Crash Course",a:"Eric Matthes",img:"https://images.unsplash.com/photo-1481627834876-b7833e8f5570",free:true},
{id:5,t:"System Design",a:"Alex Xu",img:"https://images.unsplash.com/photo-1551288049-bebda4e38f71",free:false},
{id:6,t:"Refactoring",a:"Fowler",img:"https://images.unsplash.com/photo-1554224155-6726b3ff858f",free:true},
{id:7,t:"Algorithms",a:"CLRS",img:"https://images.unsplash.com/photo-1519681393784-d120267933ba",free:true},
{id:8,t:"Operating System",a:"Galvin",img:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d",free:true},
{id:9,t:"DBMS",a:"Korth",img:"https://images.unsplash.com/photo-1473755504818-b72b6dfdc226",free:true},
{id:10,t:"Networks",a:"Tanenbaum",img:"https://images.unsplash.com/photo-1498050108023-c5249f4df085",free:true},
{id:11,t:"AI Basics",a:"Russell",img:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d",free:true},
{id:12,t:"Machine Learning",a:"Andrew Ng",img:"https://images.unsplash.com/photo-1518770660439-4636190af475",free:true}
];

let history=[
{b:2,s:101,i:"01/04",r:null},
{b:5,s:101,i:"02/04",r:"05/04"}
];

let me=101;

function makeBox(b,extra="",showBtn=false,hideStatus=false){
return `
<div class="bookItem" onclick="take(${b.id})">
<img src="${b.img}">
<div class="bookText">
<h3>${b.t}</h3>
<p>${b.a}</p>

${!hideStatus ? `<p class="${b.free?'ok':'no'}">
${b.free?'Available':'Borrowed'}
</p>` : ""}

<small>${extra}</small>

${showBtn ? `<button class="returnBtn" onclick="event.stopPropagation(); returnThis(${b.id})">Return</button>` : ""}
</div>
</div>`;
}

function showAll(){
let area=document.getElementById("showHere");
area.innerHTML="";
bookList.forEach(x=>area.innerHTML+=makeBox(x));
}

function showMine(){
let area=document.getElementById("showHere");
area.innerHTML="";
history.filter(x=>x.s===me && !x.r).forEach(x=>{
let b=bookList.find(i=>i.id===x.b);
area.innerHTML+=makeBox(b,"Issued: "+x.i,true);
});
}

function showDone(){
let area=document.getElementById("showHere");
area.innerHTML="";
history.filter(x=>x.s===me && x.r).forEach(x=>{
let b=bookList.find(i=>i.id===x.b);
area.innerHTML+=makeBox(b,"Returned on: "+x.r,false,true);
});
}

function take(id){
let b=bookList.find(x=>x.id===id);
if(!b.free){alert("Already issued");return;}
b.free=false;
history.push({b:id,s:me,i:new Date().toLocaleDateString(),r:null});
showAll();
}

function returnThis(id){
let rec=history.find(x=>x.b===id && x.s===me && !x.r);
if(!rec){alert("Not found");return;}
rec.r=new Date().toLocaleDateString();
let b=bookList.find(x=>x.id===id);
if(b) b.free=true;
showMine();
}

document.getElementById("findBook").addEventListener("input",function(){
let v=this.value.toLowerCase();
let area=document.getElementById("showHere");
area.innerHTML="";
bookList.forEach(b=>{
if(b.t.toLowerCase().includes(v)||b.a.toLowerCase().includes(v)){
area.innerHTML+=makeBox(b);
}
});
});

showAll();

</script>

</body>
</html>
