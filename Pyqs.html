<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYQs Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* same blue white colors */
        :root {
            --primary-blue: #1e3a8a;
            --blue-500: #3b82f6;
            --blue-100: #dbeafe;
            --blue-50: #eff6ff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --white: #ffffff;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--gray-900);
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-500));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--gray-600);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* white cards with blue top */
        .white-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-100);
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        .card-top {
            height: 5px;
            background: linear-gradient(90deg, var(--primary-blue), var(--blue-500));
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .card-body {
            padding: 30px;
        }

        /* better filters */
        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .filter-box {
            position: relative;
        }

        .filter-label {
            display: block;
            font-weight: 600;
            color: var(--blue-500);
            font-size: 0.9rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-input {
            padding: 16px 20px 16px 45px;
            border: 2px solid var(--blue-100);
            border-radius: var(--radius);
            font-size: 1rem;
            background: var(--white);
            width: 100%;
            transition: all 0.3s;
            background-image: linear-gradient(90deg, var(--blue-50), var(--white));
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--blue-500);
            background: var(--blue-50);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
            transform: translateY(-1px);
        }

        .filter-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--blue-500);
            font-size: 0.9rem;
        }

        .search-button {
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-500));
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .search-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(30,58,138,0.4);
        }

        .search-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .search-button:hover::before {
            left: 100%;
        }

        /* quick buttons */
        .quick-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin: 25px 0;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 16px;
            background: var(--white);
            border: 2px solid var(--blue-100);
            border-radius: var(--radius);
            color: var(--blue-500);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .quick-btn:hover {
            background: var(--blue-500);
            color: white;
            transform: translateY(-3px);
            border-color: var(--blue-500);
            box-shadow: 0 10px 25px rgba(59,130,246,0.3);
        }

        /* results */
        .pyqs-section h2 {
            font-size: 1.9rem;
            margin: 35px 0 25px 0;
            color: var(--gray-900);
            font-weight: 700;
        }

        .count {
            color: var(--blue-500);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .pyqs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            margin-top: 20px;
        }

        .pyq-item {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-100);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
        }

        .pyq-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-blue), var(--blue-500));
        }

        .pyq-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .pyq-top {
            padding: 30px 25px;
            text-align: center;
            background: linear-gradient(135deg, var(--blue-50), var(--white));
            position: relative;
        }

        .exam-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-500));
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(30,58,138,0.3);
        }

        .pyq-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .pyq-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--gray-600);
            font-size: 0.98rem;
            font-weight: 500;
        }

        .pyq-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pyq-bottom {
            padding: 25px;
            border-top: 1px solid var(--gray-100);
            background: var(--gray-50);
        }

        /* changed green to blue download */
        .download-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-500));
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(30,58,138,0.4);
        }

        /* mobile */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }
            
            h1 {
                font-size: 2.3rem;
            }
            
            .filters-row {
                grid-template-columns: 1fr;
            }
            
            .quick-row {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            
            .pyqs-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-pdf"></i> PYQs Portal</h1>
            <p class="subtitle">Previous year question papers for all courses & semesters</p>
        </header>

        <!-- filters -->
        <div class="white-card">
            <div class="card-top"></div>
            <div class="card-body">
                <div class="filters-row">
                    <div class="filter-box">
                        <label class="filter-label"><i class="fas fa-graduation-cap"></i> Course</label>
                        <i class="fas fa-graduation-cap filter-icon"></i>
                        <select class="filter-input" id="course">
                            <option>All Courses</option>
                            <option>B.Tech CSE</option>
                            <option>B.Tech ECE</option>
                            <option>B.Tech ME</option>
                            <option>M.Tech</option>
                            <option>MBA</option>
                        </select>
                    </div>
                    <div class="filter-box">
                        <label class="filter-label"><i class="fas fa-book"></i> Subject</label>
                        <i class="fas fa-book filter-icon"></i>
                        <select class="filter-input" id="subject">
                            <option>All Subjects</option>
                            <option>Data Structures</option>
                            <option>Algorithms</option>
                            <option>Database Systems</option>
                            <option>Operating Systems</option>
                            <option>Computer Networks</option>
                        </select>
                    </div>
                    <div class="filter-box">
                        <label class="filter-label"><i class="fas fa-calendar"></i> Year</label>
                        <i class="fas fa-calendar filter-icon"></i>
                        <select class="filter-input" id="year">
                            <option>All Years</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>2023</option>
                            <option>2022</option>
                        </select>
                    </div>
                    <div class="filter-box">
                        <label class="filter-label"><i class="fas fa-layer-group"></i> Semester</label>
                        <i class="fas fa-layer-group filter-icon"></i>
                        <select class="filter-input" id="sem">
                            <option>All Semesters</option>
                            <option>1st Semester</option>
                            <option>2nd Semester</option>
                            <option>3rd Semester</option>
                            <option>4th Semester</option>
                            <option>5th Semester</option>
                        </select>
                    </div>
                </div>
                <button class="search-button" onclick="filterResults()">
                    <i class="fas fa-search"></i> Find Question Papers
                </button>
            </div>
        </div>

        <!-- quick actions -->
        <div class="quick-row">
            <a href="#" class="quick-btn" onclick="upload()">
                <i class="fas fa-upload"></i> Upload PYQ
            </a>
            <a href="#" class="quick-btn" onclick="favorites()">
                <i class="fas fa-heart"></i> My Favorites
            </a>
            <a href="#" class="quick-btn" onclick="trending()">
                <i class="fas fa-fire"></i> Trending
            </a>
            <a href="#" class="quick-btn" onclick="reset()">
                <i class="fas fa-refresh"></i> Clear All
            </a>
        </div>

        <!-- results -->
        <div class="pyqs-section">
            <h2>Latest PYQs <span class="count" id="count">5</span></h2>
            <div class="pyqs-grid" id="results">
                <!-- loaded by js -->
            </div>
        </div>
    </div>

    <script>
        // data array
        let allPyqs = [
            {id:1, type:'Mid Sem', course:'B.Tech CSE', sub:'Data Structures', year:2025, sem:'3rd Semester'},
            {id:2, type:'End Sem', course:'B.Tech CSE', sub:'Algorithms', year:2025, sem:'4th Semester'},
            {id:3, type:'Mid Sem', course:'B.Tech ECE', sub:'Digital Electronics', year:2025, sem:'3rd Semester'},
            {id:4, type:'End Sem', course:'B.Tech ME', sub:'Thermodynamics', year:2024, sem:'4th Semester'},
            {id:5, type:'Mid Sem', course:'B.Tech CSE', sub:'Database Systems', year:2024, sem:'5th Semester'},
            {id:6, type:'End Sem', course:'M.Tech', sub:'Machine Learning', year:2025, sem:'1st Semester'}
        ];

        let currentResults = [...allPyqs];

        window.onload = function() {
            loadResults(currentResults);
        }

        function loadResults(data) {
            let html = '';
            let grid = document.getElementById('results');
            let count = document.getElementById('count');
            
            count.textContent = data.length;
            
            data.forEach(p => {
                html += `
                    <div class="pyq-item" onclick="download(${p.id})">
                        <div class="pyq-top">
                            <div class="exam-tag">${p.type}</div>
                            <div class="pyq-name">${p.sub}</div>
                            <div class="pyq-info">
                                <span><i class="fas fa-university"></i> ${p.course}</span>
                                <span><i class="fas fa-calendar-alt"></i> ${p.year} | ${p.sem}</span>
                            </div>
                        </div>
                        <div class="pyq-bottom">
                            <button class="download-btn" onclick="event.stopPropagation()">
                                <i class="fas fa-download"></i> Download PDF
                            </button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterResults() {
            let course = document.getElementById('course').value;
            let sub = document.getElementById('subject').value;
            let year = document.getElementById('year').value;
            let sem = document.getElementById('sem').value;

            currentResults = allPyqs.filter(p => {
                return (course === 'All Courses' || p.course.includes(course)) &&
                       (sub === 'All Subjects' || p.sub.includes(sub)) &&
                       (year === 'All Years' || p.year == year) &&
                       (sem === 'All Semesters' || p.sem.includes(sem));
            });

            loadResults(currentResults);
        }

        function download(id) {
            let pyq = allPyqs.find(p => p.id === id);
            alert('Downloading ' + pyq.sub + ' (' + pyq.type + ') PDF...');
        }

        // quick functions
        function upload() { alert('Upload PYQ form coming soon!'); }
        function favorites() { alert('Loading your saved PYQs...'); }
        function trending() { alert('Showing most downloaded PYQs'); }
        function reset() {
            document.getElementById('course').value = 'All Courses';
            document.getElementById('subject').value = 'All Subjects';
            document.getElementById('year').value = 'All Years';
            document.getElementById('sem').value = 'All Semesters';
            loadResults(allPyqs);
        }
    </script>
</body>
</html>
