<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PYQs Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
    padding:20px;
}

.wrap{max-width:1100px;margin:auto;}

h1{
    text-align:center;
    font-size:2.6rem;
    background:linear-gradient(135deg,#1e3a8a,#3b82f6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub{text-align:center;color:#555;margin-bottom:20px;}

.search{
    max-width:600px;
    margin:0 auto 25px auto;
    background:white;
    border-radius:12px;
    padding:8px;
    border:2px solid #dbeafe;
}

.searchWrap{
    display:flex;
    align-items:center;
    gap:10px;
    background:#eef4ff;
    border-radius:10px;
    padding:5px 10px;
}

.searchWrap input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    background:transparent;
}

.boxBtns{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.btnCard{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px;
    background:white;
    border:2px solid #dbeafe;
    border-radius:12px;
    color:#3b82f6;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btnCard:hover{
    background:#3b82f6;
    color:white;
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(59,130,246,0.3);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.tag{
    display:inline-block;
    background:#3b82f6;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:0.8rem;
}

.title{
    font-weight:700;
    margin-top:6px;
}

.info{
    font-size:0.9rem;
    color:#555;
}

.downBtn{
    width:100%;
    margin-top:10px;
    padding:8px;
    border:none;
    background:#3b82f6;
    color:white;
    border-radius:6px;
}

.star{
    text-align:right;
    font-size:20px;
    color:gold;
    margin-top:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

<h1>PYQs Portal</h1>
<p class="sub">Previous Year Question Papers</p>

<div class="search">
<div class="searchWrap">
<i class="fas fa-search"></i>
<input type="text" id="searchBox" placeholder="Search subject or course...">
</div>
</div>

<div class="boxBtns">
<div class="btnCard" onclick="upload()"><i class="fas fa-upload"></i> Upload</div>
<div class="btnCard" onclick="showFav()"><i class="fas fa-star"></i> Favorites</div>
<div class="btnCard" onclick="showTrend()"><i class="fas fa-fire"></i> Trending</div>
</div>

<div id="list" class="grid"></div>

<input type="file" id="filePick" style="display:none">

</div>

<script>

let papers=[
{id:1,t:"MID",sub:"Data Structures",c:"B.Tech",y:2025,sem:"3rd"},
{id:2,t:"END",sub:"Algorithms",c:"B.Tech",y:2025,sem:"4th"},
{id:3,t:"MID",sub:"DBMS",c:"B.Tech",y:2024,sem:"5th"},
{id:4,t:"END",sub:"OS",c:"B.Tech",y:2023,sem:"4th"},
{id:5,t:"MID",sub:"Networks",c:"B.Tech",y:2022,sem:"5th"},
{id:6,t:"END",sub:"AI",c:"B.Tech",y:2025,sem:"6th"},
{id:7,t:"MID",sub:"Maths",c:"B.Tech",y:2021,sem:"2nd"},
{id:8,t:"END",sub:"Physics",c:"B.Tech",y:2022,sem:"1st"},
{id:9,t:"MID",sub:"Chemistry",c:"B.Tech",y:2023,sem:"1st"},
{id:10,t:"END",sub:"Microprocessor",c:"B.Tech",y:2024,sem:"3rd"},
{id:11,t:"MID",sub:"Software Engg",c:"B.Tech",y:2025,sem:"5th"},
{id:12,t:"END",sub:"Compiler Design",c:"B.Tech",y:2024,sem:"6th"},
{id:13,t:"MID",sub:"Cyber Security",c:"B.Tech",y:2023,sem:"6th"},
{id:14,t:"END",sub:"Cloud Computing",c:"B.Tech",y:2025,sem:"7th"},
{id:15,t:"MID",sub:"Big Data",c:"M.Tech",y:2025,sem:"1st"}
];

let favs=[];
let count={};

function show(list){
let box=document.getElementById("list");
box.innerHTML="";

list.forEach(p=>{
let star = favs.includes(p.id) ? "★" : "☆";

box.innerHTML+=`
<div class="card">
<span class="tag">${p.t}</span>
<div class="title">${p.sub}</div>
<div class="info">${p.c} | ${p.y} | ${p.sem}</div>

<button class="downBtn" onclick="download(${p.id})">Download</button>
<div class="star" onclick="toggle(${p.id})">${star}</div>
</div>`;
});
}

function download(id){
let p=papers.find(x=>x.id===id);
let blob=new Blob(["Question Paper\n"+p.sub],{type:"text/plain"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download=p.sub+".txt";
a.click();
count[id]=(count[id]||0)+1;
}

function toggle(id){
if(favs.includes(id)){
favs=favs.filter(x=>x!==id);
}else{
favs.push(id);
}
show(papers);
}

function showFav(){
show(papers.filter(x=>favs.includes(x.id)));
}

function showTrend(){
let sorted=[...papers].sort((a,b)=>(count[b.id]||0)-(count[a.id]||0));
show(sorted);
}

document.getElementById("searchBox").addEventListener("input",function(){
let v=this.value.toLowerCase();
show(papers.filter(p=>p.sub.toLowerCase().includes(v)||p.c.toLowerCase().includes(v)));
});

function upload(){
document.getElementById("filePick").click();
}

document.getElementById("filePick").addEventListener("change",function(e){
let f=e.target.files[0];
if(!f) return;
papers.push({id:papers.length+1,t:"MID",sub:f.name,c:"Uploaded",y:2025,sem:""});
show(papers);
});

show(papers);

</script>

</body>
</html>
