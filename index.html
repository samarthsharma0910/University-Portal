<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
    <title>Sign in & Sign up Form</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        input {
            font-family: "Poppins", sans-serif;
        }

        /* MAIN LAYOUT */

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
        }


        /* Glassy floating blobs in background */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent 60%);
            top: -150px;
            right: -100px;
            filter: blur(2px);
            opacity: 0.25;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(33, 150, 243, 0.35), transparent 60%);
            bottom: -120px;
            left: -80px;
            filter: blur(4px);
            opacity: 0.25;
            pointer-events: none;
        }

        /* MAIN CONTAINER */

        .container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            min-height: 600px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 30px;
            overflow: hidden;
            backdrop-filter: blur(18px);
            box-shadow:
                0 18px 45px rgba(13, 71, 161, 0.35),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        /* Animated blue gradient circle */
        .container:before {
            content: "";
            position: absolute;
            height: 2000px;
            width: 2000px;
            top: -10%;
            right: 48%;
            transform: translateY(-50%);
            background-image: linear-gradient(-45deg, #4481eb 0%, #04befe 100%);
            transition: 1.8s ease-in-out;
            border-radius: 50%;
            z-index: 6;
        }

        /* FORMS AREA */

        .forms-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .signin-signup {
            position: absolute;
            top: 50%;
            left: 75%;
            transform: translate(-50%, -50%);
            width: 50%;
            transition: 1s 0.7s ease-in-out;
            display: grid;
            grid-template-columns: 1fr;
            z-index: 5;
        }

        form {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 5rem;
            transition: all 0.2s 0.7s;
            overflow: hidden;
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }

        form.sign-up-form {
            opacity: 0;
            z-index: 1;
        }

        form.sign-in-form {
            z-index: 2;
        }

        .title {
            font-size: 2.2rem;
            color: #0d1b2a;
            margin-bottom: 10px;
        }

        /* INPUT FIELDS + HOVER */

        .input-field {
            max-width: 380px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            margin: 10px 0;
            height: 55px;
            border-radius: 55px;
            display: grid;
            grid-template-columns: 15% 85%;
            padding: 0 0.4rem;
            position: relative;
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.12);
            transition: all 0.3s ease;
        }

        .input-field:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(33, 150, 243, 0.22);
        }

        .input-field i {
            text-align: center;
            line-height: 55px;
            color: #4481eb;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .input-field input {
            background: transparent;
            outline: none;
            border: none;
            line-height: 1;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0d1b2a;
        }

        .input-field input::placeholder {
            color: #78909c;
            font-weight: 500;
        }

        .input-field:hover i {
            color: #04befe;
            transform: scale(1.1);
        }

        /* BUTTONS – GLASS + HOVER */

        .btn {
            width: 150px;
            background: linear-gradient(135deg, #4481eb 0%, #04befe 100%);
            border: none;
            outline: none;
            height: 49px;
            border-radius: 49px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
            margin: 10px 0;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 25px rgba(68, 129, 235, 0.4);
        }

        /* Shimmer + lift */
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 120%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 32px rgba(37, 99, 235, 0.55);
            background: linear-gradient(135deg, #3a6fd4 0%, #039be5 100%);
        }

        /* Ripple on click */
        .btn:active::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 0.6s linear;
        }

        @keyframes ripple {
            to {
                width: 280px;
                height: 280px;
                opacity: 0;
            }
        }

        /* Transparent panel buttons */

        .btn.transparent {
            margin: 0;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.85);
            width: 130px;
            height: 41px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(13, 71, 161, 0.25);
        }

        .btn.transparent:hover {
            background: rgba(68, 129, 235, 0.35);
            border-color: #e3f2fd;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 28px rgba(25, 118, 210, 0.6);
        }

        /* SOCIAL ICONS + HOVER */

        .social-text {
            padding: 0.7rem 0;
            font-size: 1rem;
            color: #455a64;
        }

        .social-media {
            display: flex;
            justify-content: center;
        }

        .social-icon {
            height: 46px;
            width: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 0.45rem;
            background: #ffffff;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            border: 1px solid #e0e0e0;
            color: inherit;
            /* important */
        }


        /* glass highlight */

        .social-icon:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            border-color: #cfd8dc;
            background: #ffffff;
        }


        /* PANELS */

        .panels-container {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-around;
            text-align: center;
            z-index: 6;
        }

        .left-panel {
            pointer-events: all;
            padding: 3rem 17% 2rem 12%;
        }

        .right-panel {
            pointer-events: none;
            padding: 3rem 12% 2rem 17%;
        }

        .panel .content {
            color: #ffffff;
            transition: transform 0.9s ease-in-out;
            transition-delay: 0.6s;
        }

        .panel h3 {
            font-weight: 600;
            line-height: 1.1;
            font-size: 1.5rem;
        }

        .panel p {
            font-size: 0.95rem;
            padding: 0.7rem 0;
        }

        /* Panel illustrative images */

        .image {
            width: 100%;
            max-width: 320px;
            transition: transform 1.1s ease-in-out;
            transition-delay: 0.4s;
        }

        /* initial offset for right side */
        .right-panel .image,
        .right-panel .content {
            transform: translateX(800px);
        }

        /* SIGN-UP MODE ANIMATIONS */

        .container.sign-up-mode:before {
            transform: translate(100%, -50%);
            right: 52%;
        }

        .container.sign-up-mode .left-panel .image,
        .container.sign-up-mode .left-panel .content {
            transform: translateX(-800px);
        }

        .container.sign-up-mode .signin-signup {
            left: 25%;
        }

        .container.sign-up-mode form.sign-up-form {
            opacity: 1;
            z-index: 2;
        }

        .container.sign-up-mode form.sign-in-form {
            opacity: 0;
            z-index: 1;
        }

        .container.sign-up-mode .right-panel .image,
        .container.sign-up-mode .right-panel .content {
            transform: translateX(0%);
        }

        .container.sign-up-mode .left-panel {
            pointer-events: none;
        }

        .container.sign-up-mode .right-panel {
            pointer-events: all;
        }

        /* RESPONSIVE */

        @media (max-width: 870px) {
            .container {
                min-height: 800px;
                height: 100vh;
            }

            .signin-signup {
                width: 100%;
                top: 95%;
                left: 50%;
                transform: translate(-50%, -100%);
                transition: 1s 0.8s ease-in-out;
            }

            .panels-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 2fr 1fr;
            }

            .panel {
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
                padding: 2.5rem 8%;
                grid-column: 1 / 2;
            }

            .right-panel {
                grid-row: 3 / 4;
            }

            .left-panel {
                grid-row: 1 / 2;
            }

            .image {
                width: 200px;
            }

            .panel .content {
                padding-right: 15%;
            }

            .panel h3 {
                font-size: 1.2rem;
            }

            .panel p {
                font-size: 0.75rem;
            }

            .btn.transparent {
                width: 110px;
                height: 35px;
                font-size: 0.7rem;
            }

            .container:before {
                width: 1500px;
                height: 1500px;
                transform: translateX(-50%);
                left: 30%;
                bottom: 68%;
                right: initial;
                top: initial;
            }

            .container.sign-up-mode:before {
                transform: translate(-50%, 100%);
                bottom: 32%;
                right: initial;
            }

            .container.sign-up-mode .left-panel .image,
            .container.sign-up-mode .left-panel .content {
                transform: translateY(-300px);
            }

            .container.sign-up-mode .right-panel .image,
            .container.sign-up-mode .right-panel .content {
                transform: translateY(0px);
            }

            .right-panel .image,
            .right-panel .content {
                transform: translateY(300px);
            }

            .container.sign-up-mode .signin-signup {
                top: 5%;
                transform: translate(-50%, 0);
            }
        }

        @media (max-width: 570px) {
            form {
                padding: 0 1.5rem;
            }

            .image {
                display: none;
            }

            .panel .content {
                padding: 0.5rem 1rem;
            }

            .container {
                padding: 1.5rem;
                border-radius: 24px;
            }

            .container:before {
                bottom: 72%;
                left: 50%;
            }

            .container.sign-up-mode:before {
                bottom: 28%;
                left: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="forms-container">
            <div class="signin-signup">
                <form action="#" class="sign-in-form">
                    <h2 class="title">Sign in</h2>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Username" />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-user-shield"></i>
                        <select id="role" style="border:none; background:transparent; outline:none; font-weight:600;">
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <input type="submit" value="Login" class="btn solid" />
                    <p class="social-text">Or Sign in with social platforms</p>
                    <div class="social-media">
                        <a href="/auth/google" class="social-icon">
                            <i class="fab fa-google" style="color:#4285F4;"></i>
                        </a>


                    </div>
                </form>
                <form action="#" class="sign-up-form">
                    <h2 class="title">Sign up</h2>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Username" />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" />
                    </div>

                    <!-- NEW: Role dropdown for signup -->
                    <div class="input-field">
                        <i class="fas fa-user-shield"></i>
                        <select id="signup-role"
                            style="border:none; background:transparent; outline:none; font-weight:600;">
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <input type="submit" class="btn" value="Sign up" />
                    <p class="social-text">Or Sign up with social platforms</p>
                    <div class="social-media">
                       <a href="https://university-portal-backend.onrender.com/auth/google" class="social-icon">
                          <i class="fab fa-google" style="color:#4285F4;"></i>
                    </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>Don't have an account?</h3>
                    <p>
                        Click on the Sign up button below to create your account to get started.
                    </p>
                    <button class="btn transparent" id="sign-up-btn">
                        Sign up
                    </button>
                </div>
                <img src="img/log.svg" class="image" alt="" />
            </div>
            <div class="panel right-panel">
                <div class="content">
                    <h3>Already registered ?</h3>
                    <p>
                        Click on the Sign in button below to access your account
                    </p>
                    <button class="btn transparent" id="sign-in-btn">
                        Sign in
                    </button>
                </div>
                <img src="img/register.svg" class="image" alt="" />
            </div>
        </div>
    </div>

    <script>
        const signInForm = document.querySelector(".sign-in-form");
        const signUpForm = document.querySelector(".sign-up-form");
        const sign_in_btn = document.querySelector("#sign-in-btn");
        const sign_up_btn = document.querySelector("#sign-up-btn");
        const container = document.querySelector(".container");
        // Toggle forms
        sign_up_btn.addEventListener("click", () => {
            container.classList.add("sign-up-mode");
        });
        sign_in_btn.addEventListener("click", () => {
            container.classList.remove("sign-up-mode");
        });

        // === SIGNUP FORM HANDLER ===
        // === SIGNUP FORM HANDLER ===
        if (signUpForm) {
            signUpForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const username = signUpForm.querySelector('input[type="text"]').value.trim();
                const email = signUpForm.querySelector('input[type="email"]').value.trim();
                const password = signUpForm.querySelector('input[type="password"]').value.trim();
                const role = document.querySelector("#signup-role").value;  // NEW

                if (!username || !email || !password || !role) {
                    alert("Please fill all fields");
                    return;
                }

                try {
                    const response = await fetch("https://university-portal-backend.onrender.com/signup", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({ username, email, password, role }) // send role
                    });

                    const data = await response.json();
                    console.log("Signup response:", data);

                    if (data.success) {
                        alert("Account created successfully!");
                        window.location.href = data.redirect || "/dashboard.html";
                    } else {
                        alert(data.message || "Signup failed");
                    }
                } catch (err) {
                    console.error("Signup error:", err);
                    alert("Server error during signup");
                }
            });
        }

        // === SIGNIN FORM HANDLER ===
        // === SIGNIN FORM HANDLER ===
        if (signInForm) {
            signInForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const username = signInForm.querySelector('input[type="text"]').value.trim();
                const password = signInForm.querySelector('input[type="password"]').value.trim();
                const role = document.querySelector("#role").value;  // NEW

                if (!username || !password || !role) {
                    alert("Please enter username, password and role");
                    return;
                }

                try {
                    const response = await fetch("https://university-portal-backend.onrender.com/signin", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({ username, password, role }) // include role
                    });

                    const data = await response.json();
                    console.log("Signin response:", data);

                    if (data.success) {
                        window.location.href = data.redirect || "/dashboard.html";
                    } else {
                        alert(data.message || "Login failed");
                    }
                } catch (err) {
                    console.error("Signin error:", err);
                    alert("Server error during login");
                }
            });
        }
    
    </script>

</body>

</html>
